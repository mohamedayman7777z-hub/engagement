<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دعوة خطوبة أحمد &amp; صفا</title>
<meta name="description" content="يسعدنا حضوركم حفل خطوبة أحمد وصفا - 20 نوفمبر">
<meta property="og:title" content="دعوة خطوبة أحمد &amp; صفا">
<meta property="og:description" content="يسعدنا حضوركم ومشاركتنا أجمل لحظاتنا">
<meta name="theme-color" content="#fbf6ef">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#fbf6ef; --beige:#f1e6d6; --blush:#f4d6da; --rose:#d98a9b;
  --gold:#b8934a; --gold-light:#e3c987; --ink:#5a4a3f; --muted:#8a7868;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(ellipse at 50% 0%,#fff 0%,transparent 60%),
    radial-gradient(ellipse at 50% 100%,var(--blush) 0%,transparent 55%),
    var(--ivory);
  min-height:100svh;
  overflow-x:hidden;
}
/* إطار ذهبي رفيع */
.frame{position:fixed;inset:12px;border:1px solid var(--gold-light);border-radius:18px;pointer-events:none;z-index:3;opacity:.8}
.frame::after{content:"";position:absolute;inset:6px;border:1px solid rgba(227,201,135,.45);border-radius:13px}

/* الورود في الزوايا */
.corner{position:fixed;width:min(46vw,380px);height:min(46vw,380px);pointer-events:none;z-index:1;
  opacity:0;animation:bloom 2.2s cubic-bezier(.2,.7,.2,1) .1s forwards}
.tl{top:0;left:0;transform-origin:0 0}
.tr{top:0;right:0;transform-origin:100% 0;--f:-1}
.bl{bottom:0;left:0;transform-origin:0 100%;--g:-1}
.br{bottom:0;right:0;transform-origin:100% 100%;--f:-1;--g:-1}
.corner{transform:scale(calc(var(--f,1)*.6),calc(var(--g,1)*.6))}
@keyframes bloom{to{opacity:1;transform:scale(var(--f,1),var(--g,1))}}
.corner use{transform-origin:center}

/* بتلات ناعمة تتساقط */
.petals{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.petals i{position:absolute;top:-30px;width:12px;height:16px;border-radius:70% 0 70% 0;background:var(--blush);opacity:0;
  animation:fall 14s linear infinite}
.petals i:nth-child(1){left:12%;animation-delay:3s}
.petals i:nth-child(2){left:28%;animation-delay:7s;width:9px;height:12px}
.petals i:nth-child(3){left:46%;animation-delay:5s}
.petals i:nth-child(4){left:63%;animation-delay:9s;width:10px;height:13px;background:#fff}
.petals i:nth-child(5){left:79%;animation-delay:4s}
.petals i:nth-child(6){left:90%;animation-delay:11s;width:9px;height:12px}
@keyframes fall{
  0%{transform:translate(0,0) rotate(0);opacity:0}
  10%{opacity:.75}
  100%{transform:translate(-60px,105vh) rotate(260deg);opacity:0}
}

main{position:relative;z-index:2;max-width:880px;margin:0 auto;padding:clamp(64px,12vh,110px) 24px 80px;text-align:center}
.reveal{opacity:0;transform:translateY(14px);animation:rise 1.2s ease forwards}
.d1{animation-delay:.9s}.d2{animation-delay:1.3s}.d3{animation-delay:1.8s}.d4{animation-delay:2.2s}.d5{animation-delay:2.6s}
@keyframes rise{to{opacity:1;transform:none}}

.bismillah{font-size:1.05rem;color:var(--gold);letter-spacing:.02em}
.intro{margin-top:18px;font-size:1.1rem;color:var(--muted)}

.names{
  margin:clamp(22px,5vh,40px) 0 10px;
  font-family:"Aref Ruqaa","Amiri",serif;font-weight:700;
  font-size:clamp(3.6rem,15vw,8rem);line-height:1.25;
  display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:0 .3em;
  color:var(--gold);
  background:linear-gradient(120deg,#9c7a33 0%,#d9bb6c 45%,#a98239 70%,#d9bb6c 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.names .amp{font-size:.55em;color:var(--rose);-webkit-text-fill-color:var(--rose)}

.welcome{font-size:clamp(1.15rem,3.6vw,1.5rem);line-height:1.9;max-width:520px;margin:0 auto}
.divider{display:flex;align-items:center;gap:14px;justify-content:center;margin:34px auto;color:var(--gold);max-width:320px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:linear-gradient(to left,var(--gold-light),transparent)}
.divider::after{background:linear-gradient(to right,var(--gold-light),transparent)}

.details{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{
  background:rgba(255,255,255,.72);
  border:1px solid rgba(227,201,135,.7);
  border-radius:22px;padding:26px 16px 24px;
  backdrop-filter:blur(3px);
  box-shadow:0 10px 30px -18px rgba(184,147,74,.55);
}
.card svg{width:38px;height:38px;stroke:var(--gold);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;margin-bottom:12px}
.card h3{font-size:1rem;font-weight:500;color:var(--muted);margin-bottom:6px}
.card p{font-size:1.25rem;font-weight:700;line-height:1.6}
.card small{display:block;font-size:.95rem;font-weight:400;color:var(--muted);margin-top:2px}

.btn{
  display:inline-block;margin-top:34px;padding:14px 34px;border-radius:999px;
  background:linear-gradient(135deg,#c9a24b,#e3c987 50%,#b8934a);
  color:#fff;text-decoration:none;font-weight:700;font-size:1.05rem;
  box-shadow:0 12px 24px -12px rgba(184,147,74,.9);
  transition:transform .25s ease,box-shadow .25s ease;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 16px 28px -12px rgba(184,147,74,.95)}
.btn:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
.footer{margin-top:44px;color:var(--gold);font-size:1.05rem}

@media (max-width:680px){
  .details{grid-template-columns:1fr}
  .frame{inset:8px}
  .corner{width:62vw;height:62vw;max-width:300px;max-height:300px}
}
@media (prefers-reduced-motion:reduce){
  .corner,.reveal{animation:none;opacity:1;transform:scale(var(--f,1),var(--g,1))}
  .reveal{transform:none}
  .petals{display:none}
}
</style>
</head>
<body>

<!-- رسومات الورود (SVG مضمّنة بدون صور خارجية) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="rose" viewBox="-50 -50 100 100">
      <g stroke="#fff" stroke-opacity=".55" stroke-width=".7">
        <g fill="#f4d3d9">
          <ellipse cy="-26" rx="13" ry="21"/><ellipse cy="-26" rx="13" ry="21" transform="rotate(45)"/>
          <ellipse cy="-26" rx="13" ry="21" transform="rotate(90)"/><ellipse cy="-26" rx="13" ry="21" transform="rotate(135)"/>
          <ellipse cy="-26" rx="13" ry="21" transform="rotate(180)"/><ellipse cy="-26" rx="13" ry="21" transform="rotate(225)"/>
          <ellipse cy="-26" rx="13" ry="21" transform="rotate(270)"/><ellipse cy="-26" rx="13" ry="21" transform="rotate(315)"/>
        </g>
        <g fill="#ecadba">
          <ellipse cy="-17" rx="10" ry="15" transform="rotate(20)"/><ellipse cy="-17" rx="10" ry="15" transform="rotate(80)"/>
          <ellipse cy="-17" rx="10" ry="15" transform="rotate(140)"/><ellipse cy="-17" rx="10" ry="15" transform="rotate(200)"/>
          <ellipse cy="-17" rx="10" ry="15" transform="rotate(260)"/><ellipse cy="-17" rx="10" ry="15" transform="rotate(320)"/>
        </g>
        <g fill="#de8fa2">
          <ellipse cy="-9" rx="6.5" ry="9.5"/><ellipse cy="-9" rx="6.5" ry="9.5" transform="rotate(72)"/>
          <ellipse cy="-9" rx="6.5" ry="9.5" transform="rotate(144)"/><ellipse cy="-9" rx="6.5" ry="9.5" transform="rotate(216)"/>
          <ellipse cy="-9" rx="6.5" ry="9.5" transform="rotate(288)"/>
        </g>
      </g>
      <circle r="3.4" fill="#c9a24b"/>
    </symbol>
    <symbol id="bloom" viewBox="-50 -50 100 100">
      <g fill="#fff" stroke="#e9dcc6" stroke-width="1.2">
        <circle cy="-24" r="19"/><circle cy="-24" r="19" transform="rotate(72)"/><circle cy="-24" r="19" transform="rotate(144)"/>
        <circle cy="-24" r="19" transform="rotate(216)"/><circle cy="-24" r="19" transform="rotate(288)"/>
      </g>
      <circle r="7" fill="#e3c987"/><circle r="3" fill="#b8934a"/>
    </symbol>
    <path id="lf" d="M0 0C14-15 40-15 56 0C40 15 14 15 0 0Z" fill="#a9b99a"/>
    <path id="lf2" d="M0 0C14-15 40-15 56 0C40 15 14 15 0 0Z" fill="#c2cfb2"/>
    <symbol id="cluster" viewBox="0 0 300 300">
      <g transform="translate(20 20)">
        <use href="#lf" transform="rotate(8) translate(60 0)"/>
        <use href="#lf2" transform="rotate(30) translate(110 0) scale(.9)"/>
        <use href="#lf" transform="rotate(52) translate(80 0)"/>
        <use href="#lf2" transform="rotate(72) translate(120 0) scale(.9)"/>
        <use href="#lf" transform="rotate(82) translate(60 0)"/>
        <use href="#lf" transform="rotate(18) translate(165 0) scale(.8)"/>
        <use href="#lf" transform="rotate(66) translate(170 0) scale(.8)"/>
      </g>
      <use href="#bloom" x="165" y="10" width="44" height="44"/>
      <use href="#bloom" x="8" y="175" width="44" height="44"/>
      <use href="#bloom" x="150" y="105" width="34" height="34"/>
      <use href="#rose" x="125" y="12" width="82" height="82"/>
      <use href="#rose" x="8" y="118" width="82" height="82"/>
      <use href="#rose" x="-15" y="-15" width="150" height="150"/>
      <use href="#rose" x="92" y="92" width="64" height="64"/>
      <use href="#bloom" x="205" y="52" width="30" height="30"/>
      <use href="#bloom" x="52" y="215" width="30" height="30"/>
    </symbol>
  </defs>
</svg>

<div class="frame"></div>
<svg class="corner tl" aria-hidden="true"><use href="#cluster" width="100%" height="100%"/></svg>
<svg class="corner tr" aria-hidden="true"><use href="#cluster" width="100%" height="100%"/></svg>
<svg class="corner bl" aria-hidden="true"><use href="#cluster" width="100%" height="100%"/></svg>
<svg class="corner br" aria-hidden="true"><use href="#cluster" width="100%" height="100%"/></svg>

<div class="petals" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>

<main>
  <p class="bismillah reveal d1">بسم الله الرحمن الرحيم</p>
  <p class="intro reveal d1">يتشرف الأهل بدعوتكم لحضور حفل خطوبة</p>

  <h1 class="names reveal d2">
    <span>أحمد</span><span class="amp">&amp;</span><span>صفا</span>
  </h1>

  <p class="welcome reveal d3">يسعدنا حضوركم ومشاركتنا أجمل لحظاتنا</p>

  <div class="divider reveal d3" aria-hidden="true">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.3-9.2C1.5 8.4 3.4 5 6.7 5c2 0 3.5 1.1 5.3 3.1C13.800 6.100 15.300 5 17.300 5c3.300 0 5.200 3.400 4 6.800C19.500 16.400 12 21 12 21z"/></svg>
  </div>

  <section class="details reveal d4" aria-label="تفاصيل الحفل">
    <article class="card">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
      <h3>التاريخ</h3>
      <p>20 نوفمبر<small>الجمعة</small></p>
    </article>
    <article class="card">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <h3>الوقت</h3>
      <p>من 2 مساءً<small>حتى 5 مساءً</small></p>
    </article>
    <article class="card">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.100 7-11.500A7 7 0 0 0 5 9.500C5 14.900 12 21 12 21z"/><circle cx="12" cy="9.500" r="2.500"/></svg>
      <h3>المكان</h3>
      <p>قاعة فانتازيا<small>طريق ميت بره</small></p>
    </article>
  </section>

  <a class="btn reveal d5" target="_blank" rel="noopener noreferrer"
     href="https://www.google.com/maps/search/?api=1&query=%D9%82%D8%A7%D8%B9%D8%A9+%D9%81%D8%A7%D9%86%D8%AA%D8%A7%D8%B2%D9%8A%D8%A7+%D9%85%D9%8A%D8%AA+%D8%A8%D8%B1%D9%87">
    عرض الموقع على الخريطة
  </a>

  <p class="footer reveal d5">بحضوركم تكتمل فرحتنا</p>
</main>
</body>
</html>
